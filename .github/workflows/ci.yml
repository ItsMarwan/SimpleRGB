name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SimpleRGB.sln
      - name: Build
        run: dotnet build SimpleRGB.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/SimpleRGB.Tests -c Release --no-build --logger "console;verbosity=normal"
